# Batch job that deploys the P2 models and loads the synthetic payments (sample-data/load.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-loader
  namespace: bpo-demo-tr
  labels: {app.kubernetes.io/name: demo-loader, app.kubernetes.io/part-of: bpo-demo}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: demo-loader, app.kubernetes.io/part-of: bpo-demo}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loader
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["sh", "/scripts/load.sh"]
          env:
            - name: CRED
              valueFrom: {secretKeyRef: {name: camunda-presenter, key: credential}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: demo-loader}
        - name: models
          configMap: {name: demo-models}
        - name: data
          configMap: {name: demo-scenarios}
        - {name: tmp, emptyDir: {}}
