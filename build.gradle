plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.springframework.boot' version '4.1.1' apply false
}

description = 'bpo - Camunda 8.10 process orchestration - FinTechBankX'

// Pins for the whole repository. The engine version here, the CPT image and deploy/camunda-platform/chart-lock.yaml
// move together (07 §2.5: an engine upgrade touches only this repository).
ext {
    springBootVersion = '4.1.1'
    camundaVersion = '8.10.4'
    archunitVersion = '1.4.1'
}

allprojects {
    group = 'com.fintechbankx'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(23)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "io.camunda:camunda-bom:${camundaVersion}"
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
