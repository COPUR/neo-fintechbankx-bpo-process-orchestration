provider: ntf
service: notification service (not created yet, phase 5)
operations:
  sendNotification:
    status: requested
    method: POST
    path: /api/v1/notifications
    idempotencyKey: "<applicationId>:notify-<purpose>"
    request: {subjectRef: id, purpose: [ACCOUNT_OPENED, ACCOUNT_APPLICATION_REJECTED]}
    response: {notificationRef: id}
    personalData: none   # ntf resolves the channel and address from the subject; bpo never sees them
