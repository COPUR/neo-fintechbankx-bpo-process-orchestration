# Provider base URLs come from the environment; there is no default, so a pod without them does not start.
bpo:
  providers:
    cus:
      base-url: ${BPO_PROVIDER_CUS_URL}
    cmp:
      base-url: ${BPO_PROVIDER_CMP_URL}
    acc:
      base-url: ${BPO_PROVIDER_ACC_URL}
    psg-tr:
      base-url: ${BPO_PROVIDER_PSG_TR_URL}
    ntf:
      base-url: ${BPO_PROVIDER_NTF_URL}
  auth:
    token-uri: ${BPO_AUTH_TOKEN_URI:}
    client-id: svc-bpo-worker-onboarding
    client-credential: ${BPO_AUTH_CLIENT_CREDENTIAL:}
    scope: ${BPO_AUTH_SCOPE:}
# The engine address and auth come from the environment (CAMUNDA_CLIENT_MODE, CAMUNDA_CLIENT_REST_ADDRESS,
# CAMUNDA_CLIENT_GRPC_ADDRESS, CAMUNDA_CLIENT_AUTH_*); the chart sets them.
