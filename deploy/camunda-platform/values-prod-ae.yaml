# Production, one cluster per jurisdiction (C8-K2): data and process state for
# AE never leave the AE cluster. Three brokers, six partitions, three replicas.
global:
  license:
    secret:
      existingSecret: camunda-license-ae
orchestration:
  clusterSize: "3"
  partitionCount: "6"
  replicationFactor: "3"
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  security:
    authentication:
      oidc:
        issuer: https://keycloak.ae.fintechbankx.example/realms/fintechbankx
        redirectUrl: https://camunda.ae.fintechbankx.example
  data:
    secondaryStorage:
      opensearch:
        url: https://opensearch.ae.fintechbankx.example:9200
        auth:
          username: camunda
