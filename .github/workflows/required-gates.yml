name: Required Gates
# CI_RUNNER (a repository or organization variable) names the runner label that runs every job in this file.
# Unset, the jobs run on GitHub-hosted ubuntu-latest. The self-hosted runner is the arm64 Lima VM registered
# under the label fbx-ci; set CI_RUNNER to that one label once this repository is in the runner's REPOS list.
# Required on the runner: Java 23 (through setup-java), Node.js 22, Docker for the Camunda Process Test
# containers (camunda/camunda:8.10.4, multi-arch), passwordless sudo for the gitleaks install, and network
# access to github.com and Docker Hub. No Actions cache is used.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 23
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Build
        shell: bash
        run: ./gradlew --no-daemon clean assemble -x test

  test:
    name: ci/test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # Ryuk needs its own image pull and a privileged socket mount; each test class stops its containers itself.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Run tests
        shell: bash
        # check = worker kit and handler unit tests, the hexagonal and job-type contract rules, the
        # no-Camunda ArchUnit proposal and the Camunda Process Tests of every model against the simulator.
        run: ./gradlew --no-daemon check

      - name: Behaviour changes come with tests
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=200 origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if echo "$changed" | grep -qE '(^|/)(src/main/|models/)' && ! echo "$changed" | grep -qE '(^|/)src/test/'; then
            echo "::error::This PR changes src/main or a model without changing a test. Add the test that drives the change, or label the PR no-behaviour-change."
            echo "$changed" | grep -E '(^|/)(src/main/|models/)'
            exit 1
          fi

  security:
    name: ci/security
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64; gitleaks_sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) gitleaks_arch=arm64; gitleaks_sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_${gitleaks_arch}.tar.gz"
          echo "${gitleaks_sha}  $tmpdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/gitleaks.tar.gz"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }

      - name: Run gitleaks (pull request commits)
        # A secret added and removed again inside the pull request is gone from the workspace but not from history.
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect --source . --no-banner --redact --config .gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA" \
            --report-format json --report-path gitleaks-history.json || {
              cat gitleaks-history.json
              exit 1
            }
