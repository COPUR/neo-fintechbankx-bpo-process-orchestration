# Job types (07 O7): <context>.<command>; a breaking change adds .v2 and old instances finish on the old type.
# Each entry names the worker family that serves it and the provider operation it calls. The expectation
# files under contracts/expectations/ hold the fields; "requested" means the operation is not in the
# catalog yet and the simulator stands in for it.
job-types:
  cus.verify-kyc: {family: onboarding, provider: cus, operation: getKycStatus, contract: requested, outputs: [kycStatus]}
  cmp.screen: {family: onboarding, provider: cmp, operation: screenOnboardingApplicant, contract: requested, outputs: [screeningId, screeningDecision]}
  cmp.open-review-case: {family: onboarding, provider: cmp, operation: openReviewCase, contract: requested, outputs: [caseId]}
  cmp.record-review-decision: {family: onboarding, provider: cmp, operation: recordReviewDecision, contract: requested, outputs: [reviewOutcome]}
  acc.open-account: {family: onboarding, provider: acc, operation: openApplicationAccount, contract: requested, outputs: [accountId], pivot: true}
  acc.reject-application: {family: onboarding, provider: acc, operation: rejectAccountApplication, contract: requested, outputs: []}
  psg-tr.alias-offer: {family: onboarding, provider: psg-tr, operation: offerKolayAdresAlias, contract: requested, outputs: [aliasOfferStatus]}
  ntf.notify: {family: onboarding, provider: ntf, operation: sendNotification, contract: requested, outputs: [notificationRef]}
# Payments family (P2 pay-instant-exception, TR FAST profile). psg.status-inquiry is read-only and rail-neutral: the
# worker serves rail FAST through psg-tr; psg-ae joins with its own expectation when that gateway exists.
  psg.status-inquiry: {family: payments, provider: psg-tr, operation: getFastInstructionStatus, contract: requested, outputs: [schemeStatus]}
  acc.capture-hold: {family: payments, provider: acc, operation: captureHold, contract: requested, outputs: [journalRef], pivot: true}
  acc.release-hold: {family: payments, provider: acc, operation: releaseHold, contract: requested, outputs: []}
  pay.record-exception-decision: {family: payments, provider: pay, operation: recordExceptionDecision, contract: requested, outputs: [exceptionOutcome]}
  pay.mark-settled: {family: payments, provider: pay, operation: markExceptionSettled, contract: requested, outputs: []}
  pay.mark-rejected: {family: payments, provider: pay, operation: markExceptionRejected, contract: requested, outputs: []}
  ntf.notify-payment: {family: payments, provider: ntf, operation: sendNotification, contract: requested, outputs: [notificationRef]}
