# Process variable allow-list (05 §5.1, 07 O6). Lint fails on any variable a model reads or writes that is
# not listed here, and on a name that looks like money or personal data (lint/rules/fbx-variable-allow-list.js).
# Allowed: business keys, status and outcome enums, reason codes, DMN outputs, deadlines. Never: amounts,
# names, IBAN, national ids, phone, e-mail, document content, message bodies, list-hit detail.
variables:
  applicationId: {kind: business-key, owner: acc, note: account application id; P1 business key}
  customerId: {kind: reference, owner: cus, note: customer id reference; never the profile}
  jurisdiction: {kind: enum, values: [AE, TR]}
  kycStatus: {kind: enum, values: [VERIFIED, PENDING, REJECTED]}
  kycSignal: {kind: enum, values: [RECEIVED], note: set by Msg_KycCompleted itself; the message payload is never merged}
  screeningId: {kind: reference, owner: cmp}
  screeningDecision: {kind: enum, values: [CLEAR, REVIEW, REJECT]}
  sourceRef: {kind: business-key, note: the calling process's business key, passed to a library process}
  sourceProcess: {kind: enum, note: the calling process id}
  caseId: {kind: reference, owner: cmp, note: review case id}
  routing: {kind: dmn-output, note: "cmp-review-routing result: reviewQueue, reviewSla, escalationQueue, escalationSla"}
  reviewDecision: {kind: enum, values: [CLEAR, REJECT, ESCALATE, EXPIRED], note: set by the review user tasks}
  reviewOutcome: {kind: enum, values: [CLEARED, REJECTED], note: cmp's recorded outcome}
  rejectionReason: {kind: reason-code, values: [KYC_REJECTED, KYC_TIMEOUT, SCREENING_REJECTED]}
  accountId: {kind: reference, owner: acc}
  aliasOfferStatus: {kind: enum, values: [OFFERED, NOT_ELIGIBLE]}
  purpose: {kind: enum, values: [ACCOUNT_OPENED, ACCOUNT_APPLICATION_REJECTED, PAYMENT_SETTLED, PAYMENT_REJECTED, RECALL_RETURNED, RECALL_UNRESOLVED], note: ntf template purpose}
  notificationRef: {kind: reference, owner: ntf}
  paymentId: {kind: business-key, owner: pay, note: P2 and P6 business key; for P2 pay set the payment to EXCEPTION_OWNED_BY_BPO before the start, for P6 pay opened its recall case}
  rail: {kind: enum, values: [FAST], note: the scheme the instruction went to; AANI joins with psg-ae}
  statusPolicy: {kind: dmn-output, note: "psg-status-inquiry-policy result: firstWait, secondWait, thirdWait"}
  schemeStatus: {kind: enum, values: [ACSC, RJCT, PDNG], note: psg's record of the instruction, re-read on every wake}
  statusSignal: {kind: enum, values: [RECEIVED], note: set by Msg_SchemeStatusReported itself; the message payload is never merged}
  exceptionRouting: {kind: dmn-output, note: "pay-exception-routing result: opsQueue, opsSla, supervisorQueue, supervisorSla"}
  exceptionDecision: {kind: enum, values: [SETTLED, REJECTED, ESCALATE, UNRESOLVED, EXPIRED], note: set by the ops user tasks (UNRESOLVED by the supervisor only) or the SLA expiry}
  exceptionOutcome: {kind: enum, values: [SETTLE, RELEASE, HANDED_BACK], note: pay's recorded outcome; pay checks the decision against psg's record}
  journalRef: {kind: reference, owner: acc, note: the capture journal entry (P2) or the return credit (P6)}
  recallPolicy: {kind: dmn-output, owner: pay-recall-policy, note: firstWait and finalWait durations only}
  recallRequestRef: {kind: reference, owner: psg, note: the gateway's reference of the recall request}
  recallStatus: {kind: enum, values: [RETURNED, DECLINED, PENDING], note: psg's record of the receiving bank's answer}
  recallSignal: {kind: enum, values: [RECEIVED], note: set by Msg_RecallAnswered itself; the message payload is never merged}
  recallOutcome: {kind: enum, values: [RETURNED, UNRESOLVED], note: the outcome P6 closes pay's recall case with}
